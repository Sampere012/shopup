name: shopup_panel
description: "ShopUp Panel — Flutter offline-first"
publish_to: 'none'
version: 0.5.0+500

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  sqflite: ^2.4.2+1
  path: ^1.9.1
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  intl: ^0.20.3
  mobile_scanner: ^7.4.0
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  collection: ^1.18.0
  crypto: ^3.0.7
  path_provider: ^2.1.5

  # UI pro
  google_fonts: ^8.2.1
  web_socket_channel: ^3.0.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3
  flutter_launcher_icons: ^0.14.4
  test: ^1.30.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#111827"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/splash_logo.png
