name: Build Android APK and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9

      - name: Install dependencies
        run: flutter pub get
        working-directory: mobile-app-2

      - name: Build release APK
        run: flutter build apk --release
        working-directory: mobile-app-2

      - name: Prepare artifact
        run: |
          cp mobile-app-2/build/app/outputs/flutter-apk/app-release.apk ./shopup-panel.apk
          ls -lh shopup-panel.apk

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "ShopUp Panel $TAG" \
              --notes "[!IMPORTANT]
Esta APK se genera automáticamente desde el código de la etiqueta $TAG."
          fi

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release upload "$TAG" ./shopup-panel.apk --repo "$GITHUB_REPOSITORY" --clobber