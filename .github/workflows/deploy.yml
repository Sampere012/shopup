name: Deploy to InfinityFree via FTP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy wp-content to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./wp-content/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}/
          dangerous-clean-slate: false

      - name: Deploy root files (sw.js, manifest, errors, .htaccess)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Sin lftp ni apt-get: curl (preinstalado en el runner) sube por FTP
          # plano. --ftp-create-dirs crea errors/ automáticamente si no existe.
          set -euo pipefail
          shopt -s nullglob
          upload() {
            curl -sS --connect-timeout 30 --max-time 90 \
              --user "${FTP_USER}:${FTP_PASS}" --ftp-create-dirs \
              -T "$1" "ftp://${FTP_HOST}/$2"
          }
          # .htaccess de producción + archivos PWA en la raíz (/htdocs).
          # sw.prod.js es la versión del Service Worker para producción (sin el
          # prefijo /workshop de la instalación local) y se sube como sw.js.
          upload sw.prod.js    htdocs/sw.js
          upload manifest.json htdocs/manifest.json
          upload htaccess.prod htdocs/.htaccess
          # Páginas de error personalizadas.
          for f in errors/*.html; do
            upload "${f}" "htdocs/errors/$(basename "${f}")"
          done

      - name: Trigger URL migration on production
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" --max-time 60 "http://shopup.site.je/" || true
