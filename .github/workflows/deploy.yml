name: Deploy to InfinityFree via FTP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy wp-content to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./wp-content/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}/
          dangerous-clean-slate: false

      - name: Deploy root files (sw.js, manifest, errors, .htaccess)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp
          lftp -e " \
            set ftp:ssl-allow no; \
            set net:timeout 30; \
            open ftp://$FTP_USER:$FTP_PASS@$FTP_HOST; \
            cd /htdocs; \
            put sw.js; \
            put manifest.json; \
            put htaccess.prod -o .htaccess; \
            mkdir -p errors; \
            mirror -R --no-perms --no-umask --verbose errors/ errors; \
            bye
          "

      - name: Trigger URL migration on production
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" --max-time 60 "http://shopup.site.je/" || true
