name: Deploy to InfinityFree via FTP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate before deploy (Vercel-style gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: PHP syntax check (php -l)
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r f; do
            if ! php -l "$f" > /tmp/php_err 2>&1; then
              echo "::error::PHP ERROR en $f"
              cat /tmp/php_err
              failed=1
            fi
          done < <(find wp-content -type f -name '*.php')
          exit $failed

      - name: JavaScript syntax check (node --check)
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r f; do
            if ! node --check "$f" > /tmp/js_err 2>&1; then
              echo "::error::JS ERROR en $f"
              cat /tmp/js_err
              failed=1
            fi
          done < <(find wp-content -type f -name '*.js')
          exit $failed

      - name: JSON syntax check
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r f; do
            if ! node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" > /tmp/json_err 2>&1; then
              echo "::error::JSON ERROR en $f"
              cat /tmp/json_err
              failed=1
            fi
          done < <(find wp-content -type f -name '*.json')
          exit $failed

      - name: Report validation errors (GitHub Issue)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MSG=$(git log -1 --format='%s')
          gh issue create \
            --title "Deploy bloqueado: errores de validación en ${{ github.sha }}" \
            --body "El deploy **no se ejecutó** (validación fallida, igual que Vercel). El sitio sigue con la versión anterior.$(printf '\n\n')- Commit: \`${{ github.sha }}\`$(printf '\n')- Mensaje: $MSG$(printf '\n')- Errores completos: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "::warning::No se pudo crear la issue (¿issues desactivados?); revisar los logs del run."

  deploy:
    name: Deploy + health check + rollback
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guardar commit anterior y mensaje
        id: info
        run: |
          set -euo pipefail
          PREV="$(git rev-parse HEAD^ 2>/dev/null || true)"
          if [ -z "$PREV" ]; then
            PREV="0000000000000000000000000000000000000000"
          fi
          MSG="$(git log -1 --format=%s)"
          {
            echo "prev<<PEOF"
            echo "$PREV"
            echo "PEOF"
            echo "msg<<MEOF"
            echo "$MSG"
            echo "MEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy wp-content a InfinityFree (curl FTP, incremental por push)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          PREV="${{ steps.info.outputs.prev }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "$PREV" != "0000000000000000000000000000000000000000" ]; then
            LIST="$(mktemp)"
            git diff --name-only --diff-filter=ACMRT "$PREV" "HEAD" -- wp-content/ > "$LIST"
            echo "::notice::Deploy INCREMENTAL: $(wc -l < "$LIST") archivos wp-content cambiados"
            export DEPLOY_FILELIST="$LIST"
          else
            echo "::notice::Deploy manual (workflow_dispatch): sincronizacion completa"
            export FULL_SYNC=1
          fi
          bash .github/scripts/ftp-deploy-wp-content.sh

      - name: Deploy archivos raiz (.htaccess, errors, APK)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          PREV="${{ steps.info.outputs.prev }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "$PREV" != "0000000000000000000000000000000000000000" ]; then
            LIST="$(mktemp)"
            git diff --name-only --diff-filter=ACMRT "$PREV" "HEAD" -- app/ htaccess.prod errors/ > "$LIST"
            echo "::notice::Deploy INCREMENTAL raiz: $(wc -l < "$LIST") archivos"
            export ROOT_FILELIST="$LIST"
          else
            echo "::notice::Deploy manual (workflow_dispatch): sincronizacion completa raiz"
          fi
          bash .github/scripts/ftp-deploy-root.sh

      - name: Health check tras el deploy (fallo = 5xx = rollback)
        id: health
        continue-on-error: true
        run: bash .github/scripts/healthcheck.sh

      # ---------------- Rollback (quedarse con la versión anterior) ----------------
      - name: Restaurar version anterior en el worktree
        if: steps.health.outcome == 'failure'
        run: |
          PREV="${{ steps.info.outputs.prev }}"
          if [ "$PREV" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::No hay commit anterior para hacer rollback"
            exit 1
          fi
          git checkout -- . 2>/dev/null || true
          git checkout "$PREV" -- wp-content app htaccess.prod errors
          echo "Version restaurada: $(git log -1 --format='%h %s' "$PREV")"

      - name: Rollback wp-content (version anterior, curl FTP)
        if: steps.health.outcome == 'failure'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          PREV="${{ steps.info.outputs.prev }}"
          if [ "$PREV" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::No hay commit anterior para rollback"
            exit 1
          fi
          LIST="$(mktemp)"
          # El worktree ya tiene la version anterior (checkout del paso previo):
          # se restauran en el servidor los archivos que difieren roto -> prev.
          git diff --name-only --diff-filter=ACMRT "${{ github.sha }}" "$PREV" -- wp-content/ > "$LIST"
          echo "::notice::Rollback INCREMENTAL: $(wc -l < "$LIST") archivos wp-content a restaurar"
          export DEPLOY_FILELIST="$LIST"
          bash .github/scripts/ftp-deploy-wp-content.sh

      - name: Rollback archivos raiz (version anterior)
        if: steps.health.outcome == 'failure'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: bash .github/scripts/ftp-deploy-root.sh

      - name: Health check tras el rollback
        if: steps.health.outcome == 'failure'
        id: rbhealth
        continue-on-error: true
        run: bash .github/scripts/healthcheck.sh

      - name: Reportar deploy roto (GitHub Issue)
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Deploy roto: la web devolvio 500 — se aplico rollback" \
            --body "El deploy de \`${{ github.sha }}\` provocó un error (HTTP 5xx) en producción en:${{ env.HEALTH_FAILED }}.$(printf '\n\n')Se aplicó **rollback** a la versión anterior (\`${{ steps.info.outputs.prev }}\`), por lo que la web vuelve a funcionar con el cambio previo.$(printf '\n\n')- Commit roto: \`${{ github.sha }}\` — ${{ steps.info.outputs.msg }}$(printf '\n')- Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "::warning::No se pudo crear la issue (¿issues desactivados?); revisar los logs del run."
